basePath: /
info:
  contact: {}
  description: API documentation
  title: Vue-WhatsApp API
  version: "1.0"
paths:
  /health:
    get:
      description: Service is up
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Health check
      tags:
      - system
  /messages:
    get:
      description: Returns messages for a conversation
      parameters:
      - description: Conversation ID
        in: query
        name: conversationId
        required: true
        type: string
      - default: 50
        description: Max number of messages
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List messages
      tags:
      - messages
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
