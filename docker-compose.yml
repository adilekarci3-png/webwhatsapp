services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      # superuser (sunucu standardı)
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-pgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-SuperPass123!}
      POSTGRES_DB: ${POSTGRES_DB_DEFAULT:-template1}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-pgadmin} -d ${POSTGRES_DB_DEFAULT:-template1}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dbnet]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminPass123!}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [dbnet]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisPass123!}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dbnet]

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
    command: server ${MINIO_DATA_DIR:-/data} --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:${MINIO_DATA_DIR:-/data}
    healthcheck:
      # MinIO image'inde curl olmayabiliyor; mc health daha stabil
      test: ["CMD-SHELL", "mc ready local || (mc alias set local http://localhost:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" && mc ready local)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [dbnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wa-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 15432
      POSTGRES_DB: webwhatsapp_db
      POSTGRES_USER: webwhatsapp_user
      POSTGRES_PASSWORD: WebWhatsappPass123!
      PGSSLMODE: disable
      MIGRATIONS_DIR: /app/internal/infrastructure/persistence/postgres/migrations
      APP_ENV: docker
      APP_PORT: "8080"    

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass123!}

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-wa-media}
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks: [dbnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_WS_URL: ${VITE_WS_URL_BUILD:-/ws}
    container_name: wa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks: [dbnet]

  nginx:
    image: nginx:alpine
    container_name: wa-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HOST_PORT:-8088}:80"
    depends_on:
      - frontend
      - backend
    networks: [dbnet]

networks:
  dbnet:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
  redisdata:
  miniodata:
